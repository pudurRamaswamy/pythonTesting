[pytest]
# Register custom markers to avoid PytestUnknownMarkWarning.
# Run subsets with: pytest -m smoke | contract | negative | live
markers =
    smoke:    Fast sanity checks; always included in every CI run
    contract: Schema-shape correctness; run on every PR
    negative: Verify that malformed payloads are rejected by the schema
    live:     Hits the real reqres.in API; requires REQRES_API_KEY env var

# Show local variables in tracebacks for easier debugging
log_cli = false
